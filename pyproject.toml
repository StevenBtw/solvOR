[project]
name = "solvor"
dynamic = ["version"]
description = "Solvor all your optimization needs."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []
authors = [
    { name = "Steven Grond" }
]

license = { text = "Apache-2.0" }
keywords = ["optimization", "solver", "linear-programming", "sat", "metaheuristics", "operations-research"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Website = "https://solvOR.ai"
Repository = "https://github.com/StevenBtw/solvOR"
PyPI = "https://pypi.org/project/solvOR/"

[project.optional-dependencies]
dev = [
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "ruff>=0.17.5",
    "pre-commit>=4.7",
    "ty>=0.0.104",
    "maturin>=1.16,<2.0",
    "prek>=0.5.10"
]
docs = [
    "zensical>=0.1.1",
    # 1.0.8 is the first that renders with current pymdown-extensions (older: Highlight() missing "md")
    "mkdocstrings[python]>=1.0.8",
]

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "."
module-name = "solvor._solvor_rust"
manifest-path = "rust/Cargo.toml"
include = ["solvor/**/*.py", "py.typed", "LICENSE"]

[tool.ruff]
line-length = 120
exclude = ["examples"]
# Ruff's default without "*.md" (added in 0.17): code blocks in the docs stay as written.
include = ["*.py", "*.pyi", "*.pyw", "*.ipynb", "**/pyproject.toml", "**/ruff.toml", "**/.ruff.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
addopts = "--cov=solvor --cov-report=term-missing --cov-fail-under=88"
testpaths = ["tests"]
markers = [
    "docs: documentation build tests (requires docs dependencies)",
    "examples: all example integration tests",
    "quick_examples: quick example scripts",
    "classic: classic optimization examples",
    "puzzles: puzzle examples (sudoku, n-queens, etc.)",
    "graph_algorithms: graph algorithm examples",
    "linear_programming: LP/MILP examples",
    "machine_learning: ML examples",
    "real_world: real-world application examples",
]

[tool.coverage.run]
source = ["solvor"]
omit = ["*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
invalid-argument-type = "ignore"
